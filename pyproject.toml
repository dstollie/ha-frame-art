[project]
name = "frame-art-integration"
version = "0.2.0"
description = "Home Assistant integration for the Frame Art add-on (native panel, API and MCP proxy)"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "home-assistant-frontend==20260930.5",
    "pytest-homeassistant-custom-component>=0.13.375",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
