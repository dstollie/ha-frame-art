configuration:
  tvs:
    name: TVs
    description: "Per Frame: a name (also its id, e.g. woonkamer), its IP address, and optionally the media_player that switches it on (SamsungTV Smart)."
  default_mode:
    name: Passe-partout style
    description: light, dark or blur, used when a TV is set to passe-partout. Fill or passe-partout per TV is set in the panel.
  keep_uploads:
    name: Uploads kept per TV
    description: Older uploads made by Frame Art are deleted from the TV.
  keep_favourite_uploads:
    name: Favourites kept per TV
  cache_mb:
    name: Cache (MB)
  sync_hour:
    name: Hour of the nightly catalogue refresh
  sync_on_start:
    name: Refresh the catalogue at every start
  mqtt:
    name: HA entities through MQTT
