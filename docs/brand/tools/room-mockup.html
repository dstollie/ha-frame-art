<!doctype html><html><head><style>
*{box-sizing:border-box}html,body{margin:0}
body{width:1600px;height:900px;overflow:hidden;position:relative;font-family:system-ui;
background:radial-gradient(ellipse 70% 60% at 42% 30%,#ece4d6 0%,#d9cfbf 55%,#c7bca9 100%)}
.wall-light{position:absolute;inset:0;background:radial-gradient(ellipse 30% 40% at 42% 18%,rgba(255,240,210,.55),transparent 70%)}
.floor{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(#9c8670,#7d6852)}
.skirting{position:absolute;left:0;right:0;bottom:150px;height:14px;background:#efe8dc;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.tv{position:absolute;left:250px;top:120px;width:800px;height:450px;background:#1b1b1d;padding:9px;
box-shadow:0 28px 50px -10px rgba(40,30,20,.45),0 8px 14px rgba(40,30,20,.25)}
.tv .screen{width:100%;height:100%;background:url(art.jpg) center/cover;position:relative}
.tv .screen:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.07),transparent 40%);}
.side{position:absolute;left:190px;top:640px;width:920px;height:120px;background:linear-gradient(#6b4f37,#5a422e);border-radius:4px;
box-shadow:0 20px 30px -8px rgba(0,0,0,.35)}
.side:before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:#7a5b40;border-radius:4px 4px 0 0}
.side i{position:absolute;top:22px;width:1px;height:86px;background:rgba(0,0,0,.25)}
.legs{position:absolute;top:760px;width:10px;height:40px;background:#3d2c1f}
.vase{position:absolute;left:1020px;top:560px;width:56px;height:80px;background:linear-gradient(90deg,#cfc6b8,#f3eee6 45%,#bfb5a5);border-radius:40% 40% 18% 18%/30% 30% 18% 18%}
.stem{position:absolute;width:3px;background:#6f6a4c;transform-origin:bottom}
.books{position:absolute;left:300px;top:604px}
.books b{display:block;height:12px;margin-top:2px;border-radius:2px}
.phone{position:absolute;right:120px;top:150px;width:300px;height:620px;border-radius:46px;background:#111;padding:11px;
box-shadow:0 40px 60px -15px rgba(30,20,10,.5)}
.phone img{background:#fafafa;padding-top:40px;width:100%;height:100%;object-fit:cover;object-position:top;border-radius:36px;display:block;background:#fafafa}
.notch{position:absolute;left:50%;top:22px;transform:translateX(-50%);width:90px;height:26px;background:#111;border-radius:14px}
</style></head><body>
<div class="wall-light"></div><div class="skirting"></div><div class="floor"></div>
<div class="tv"><div class="screen"></div></div>
<div class="books"><b style="width:120px;background:#2f4a6b"></b><b style="width:110px;background:#b0553a"></b><b style="width:126px;background:#d8c9a6"></b></div>
<div class="vase"></div>
<div class="stem" style="left:1042px;top:470px;height:95px;transform:rotate(-12deg)"></div>
<div class="stem" style="left:1050px;top:480px;height:85px;transform:rotate(14deg)"></div>
<div class="stem" style="left:1047px;top:455px;height:110px;transform:rotate(2deg)"></div>
<div class="side"><i style="left:306px"></i><i style="left:613px"></i></div>
<div class="legs" style="left:215px"></div><div class="legs" style="left:1075px"></div>
<div class="phone"><img src="phone.png"><div class="notch"></div></div>
</body></html>
