name: "CI"

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: frame_art

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  checks:
    name: lint, format, typecheck, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frame_art/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frame_art/.nvmrc
          cache: pnpm
          cache-dependency-path: frame_art/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Install Chromium for Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"

      - name: End-to-end tests (fake Frames, fake ingress prefix)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frame_art/packages/web/test-results
          retention-days: 7

  integration:
    name: integration (python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check && uv run ruff format --check

      - name: Tests
        run: uv run pytest -q

      - name: Versions match
        run: |
          addon=$(sed -nE 's/^version: "?([^"]+)"?$/\1/p' frame_art/config.yaml)
          integration=$(python3 -c "import json;print(json.load(open('custom_components/frame_art/manifest.json'))['version'])")
          test "$addon" = "$integration" || { echo "::error::add-on $addon != integration $integration"; exit 1; }

  image:
    name: build aarch64 image
    needs: [checks, integration]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version and tags
        id: meta
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/frame-art-aarch64
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -nE 's/^version: "?([^"]+)"?$/\1/p' config.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Tag $REF_NAME does not match config.yaml version $version"
            exit 1
          fi
          tags="$IMAGE:sha-${GITHUB_SHA::7}"
          push=false
          if [ "$EVENT" = "push" ]; then
            push=true
            tags="$tags,$IMAGE:edge"
            # A released version is immutable: main only publishes it the first time.
            if [ "$REF_TYPE" = "tag" ] || ! docker manifest inspect "$IMAGE:$version" >/dev/null 2>&1; then
              tags="$tags,$IMAGE:$version,$IMAGE:latest"
            fi
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "Tags: $tags"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frame_art
          platforms: linux/arm64
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BUILD_FROM=node:22-alpine
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Frame Art Home Assistant add-on (aarch64)
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
