name: Feature request
description: An idea for the add-on, the panel, MCP or the integration.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The situation and what's missing, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Frame Art help?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Explore and search, Series, My collection, TV control, MCP / AI, Home Assistant entities, Other]
